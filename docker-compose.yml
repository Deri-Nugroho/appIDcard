version: '3.8'

services:
  webserver:
    build: .
    container_name: appidcard-web
    ports:
      - "8081:80"
    depends_on:
      - dbserver
    environment:
      - DB_HOST=dbserver
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=db_idcard
    networks:
      - app-network

  dbserver:
    image: mariadb:11-jammy
    container_name: appidcard-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_idcard
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
